services:
  mongodb:
    image: mongo:7
    container_name: learning-analytics-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: learning-analytics-backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: learning_analytics
      MONGODB_COLLECTION: student_interactions
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: learning-analytics-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  mongo_data:
